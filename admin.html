<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Мајстор Насте — Фасади & Камен</title>
  <meta name="description" content="Фасади, гнајс, камини, камен и мазилка.">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>

  <!-- 🔸 Sticky Marquee -->
  <div class="marquee-sticky">
    <div class="marquee-content">
      👷 Добредојдовте кај Мајстор Насте — Професионално изведување на фасади, камен и мазилка!
    </div>
  </div>

  <!-- 🔸 HEADER -->
  <header class="nav">
    <div class="container nav-inner">
      <!-- Brand -->
      <div class="brand">
        <div class="logo flash">MN</div>
        <div class="brand-text">
          <div id="brand-name">Мајстор Насте</div>
          <div id="brand-slogan">Фасади, камен и мазилка</div>
        </div>
      </div>

      <!-- Main Navigation -->
      <nav class="main-nav">
        <a href="#hero" class="nav-link">Почетна</a>
        <a href="#services" class="nav-link">Услуги</a>
        <a href="#gallery" class="nav-link">Галерија</a>
        <a href="#contact" class="nav-link">Контакт</a>
      </nav>

      <!-- Tools -->
      <div class="tools">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="mk" title="Македонски">🇲🇰</button>
          <button class="lang-btn" data-lang="bg" title="Български">🇧🇬</button>
          <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
        </div>

        <div class="social">
          <a href="https://facebook.com/majstornaste" target="_blank" class="social-link facebook" title="Facebook"><i class="fab fa-facebook"></i></a>
          <a href="https://instagram.com/majstornaste" target="_blank" class="social-link instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="https://t.me/majstornaste" target="_blank" class="social-link telegram" title="Telegram"><i class="fab fa-telegram"></i></a>
        </div>

        <button id="shareBtn" class="btn-share" title="Сподели">🔗</button>
        <button class="hamburger" aria-label="Мену">☰</button>
      </div>
    </div>
  </header>

  <!-- Херој (пример) -->
  <section id="hero" class="hero">
    <h1>Фасади & Камен — Професионално изведување</h1>
  </section>

</body>
</html>
