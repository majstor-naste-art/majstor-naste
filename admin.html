<h2>Admin Panel</h2>
<form id="admin-form">
  <label>URL на сликата: <input type="text" id="img-url" required></label>
  <label>Alt текст: <input type="text" id="img-alt"></label>
  <button type="submit">Додади слика</button>
</form>

<ul id="admin-list"></ul>

<script>
const adminList = document.getElementById('admin-list');
const form = document.getElementById('admin-form');
let gallery = [];

async function loadGallery() {
  const res = await fetch('gallery.json');
  gallery = await res.json().then(d => d.images);
  renderGallery();
}

function renderGallery() {
  adminList.innerHTML = '';
  gallery.forEach((img, i) => {
    const li = document.createElement('li');
    li.textContent = img.src + ' | ' + img.alt;
    adminList.appendChild(li);
  });
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const url = document.getElementById('img-url').value;
  const alt = document.getElementById('img-alt').value;
  gallery.push({src: url, alt});
  renderGallery();
  form.reset();
  alert('Додадена е нова слика! За да се зачува, мораш да ја ажурираш gallery.json на сервер.');
});

loadGallery();
</script>
