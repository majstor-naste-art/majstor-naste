<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Майстор Насте — Фасади & Камен</title>
  <meta name="description" content="Майстор Насте — фасади, гнајс, камини, каменни огради и мазилка.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="logo">MN</div>
        <div class="brand-text">
          <div id="brand-name">Майстор Насте</div>
          <div id="brand-slogan">Фасади, камък и мазилка — качество без компромиси</div>
        </div>
      </div>
      <div class="actions">
        <div class="lang" role="tablist" aria-label="language">
          <button class="lang-btn active" data-lang="bg">
            <img src="flags/bg.png" alt="BG" class="flag-icon"> BG
          </button>
          <button class="lang-btn" data-lang="mk">
            <img src="flags/mk.png" alt="MK" class="flag-icon"> MK
          </button>
          <button class="lang-btn" data-lang="en">
            <img src="flags/en.png" alt="EN" class="flag-icon"> EN
          </button>
        </div>
        <a id="tel" href="tel:+359881234567" class="phone">+359 88 123 4567</a>
      </div>
    </div>
  </div>

  <!-- HERO SECTION -->
  <header class="hero active">
    <div class="container hero-inner">
      <div class="hero-left">
        <h1>Фасади & Камен - професионално изпълнение</h1>
        <p>Специализация: фасади, облицовки с гнајс, камини, каменни огради и мазилка.</p>
        <div class="cta-row">
          <a class="btn primary" href="#contact">Вземете оферта</a>
          <a class="btn ghost" href="#gallery">Галерия</a>
        </div>
      </div>
      <div class="hero-right">
        <div class="card image-card">
          <img src="sliki/1.jpg" alt="Фасада" onerror="this.src='https://placehold.co/800x600?text=Majstor+Naste'">
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <section id="gallery-section">
      <h2>Галерия</h2>
      <div id="gallery" class="masonry"></div>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
